name: Feature request
description: Propose a focused enhancement to the public library API or protocol support.
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or interoperability problem, not only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include expected API and compatibility implications where known.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: compatibility
    attributes:
      label: Compatibility
      options:
        - label: I identified any public API, MSRV, feature-flag, or platform impact.
          required: true
