name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Format, Clippy, Licenses
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup show
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Install ALSA development headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fmt --all -- --check
      - name: Validate hook configuration
        env:
          LEFTHOOK_VERSION: "2.1.12"
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/evilmartians/lefthook/releases/download/v${LEFTHOOK_VERSION}/lefthook_${LEFTHOOK_VERSION}_Linux_x86_64.gz" \
            | gzip -d > "$RUNNER_TEMP/lefthook"
          chmod +x "$RUNNER_TEMP/lefthook"
          "$RUNNER_TEMP/lefthook" validate
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-deny
      - run: cargo deny check

  test:
    name: Tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-24.04 }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm }
          - { name: macos-x86_64, runner: macos-15-intel }
          - { name: macos-aarch64, runner: macos-15 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup show
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Install ALSA development headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --all-features --locked
      - name: Install coverage tooling
        if: matrix.name == 'linux-x86_64'
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-llvm-cov
      - name: Enforce line coverage
        if: matrix.name == 'linux-x86_64'
        run: cargo llvm-cov --workspace --all-features --locked --fail-under-lines 70

  documentation:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup show
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --all-features --locked --no-deps
      - run: cargo test --workspace --all-features --locked --doc

  msrv:
    name: MSRV (Rust 1.94)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup toolchain install 1.94.0 --profile minimal
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          key: msrv-1.94.0
      - run: rustup run 1.94.0 cargo check --workspace --all-features --locked --lib

  cross-check:
    name: Cross Check (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo check --workspace --target ${{ matrix.target }} --all-features --locked --lib

  commit-hygiene:
    name: Commit Hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Validate title, body, and commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          status=0
          cc='^((feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .+|Revert ".+")'
          ban='co-authored-by:.*(claude|anthropic|codex|openai)|generated with.*(claude code|codex)'

          if ! printf '%s' "$PR_TITLE" | grep -Eq "$cc"; then
            echo "::error::PR title does not follow Conventional Commits: $PR_TITLE"
            status=1
          fi
          if [ "${#PR_TITLE}" -gt 100 ]; then
            echo "::error::PR title exceeds 100 characters"
            status=1
          fi
          if printf '%s' "$PR_BODY" | grep -Eiq "$ban"; then
            echo "::error::PR body contains automated attribution"
            status=1
          fi

          for sha in $(git rev-list "${BASE_SHA}..${HEAD_SHA}"); do
            if git log -1 --format=%B "$sha" | grep -Eiq "$ban"; then
              echo "::error::Commit $sha contains automated attribution"
              status=1
            fi
            email=$(git log -1 --format='%ae%n%ce' "$sha")
            if printf '%s' "$email" | grep -Fq 'noreply@anthropic.com'; then
              echo "::error::Commit $sha uses an Anthropic author or committer address"
              status=1
            fi
          done

          exit "$status"

  secrets:
    name: Secret Scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0

  ci-success:
    name: CI Success
    if: always()
    needs: [quality, test, documentation, msrv, cross-check, commit-hygiene, secrets]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every preceding job to pass or be skipped
        run: |
          set -euo pipefail
          printf '%s\n' '${{ toJSON(needs) }}' |
            jq -e 'all(.[]; .result == "success" or .result == "skipped")'
