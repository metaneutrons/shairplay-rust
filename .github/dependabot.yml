version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    commit-message:
      prefix: chore
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      rust-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /fuzz
    commit-message:
      prefix: chore
    schedule:
      interval: weekly
      day: monday
      time: "05:05"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      fuzz-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: rust-toolchain
    directory: /
    commit-message:
      prefix: chore
    schedule:
      interval: weekly
      day: monday
      time: "05:10"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14

  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: chore
    schedule:
      interval: weekly
      day: monday
      time: "05:15"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
