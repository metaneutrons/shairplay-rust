# cargo-deny policy for advisories, licenses, duplicate versions, and sources.
# Every advisory exception identifies its dependency path and removal condition.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  { id = "RUSTSEC-2023-0071", reason = "rsa 0.9 is exposed to the Marvin timing attack; remove when a stable rsa release containing the fix is available" },
  { id = "RUSTSEC-2024-0384", reason = "instant is pulled only by the minifb example dependency; remove when minifb no longer depends on it" },
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "LGPL-3.0-or-later",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
